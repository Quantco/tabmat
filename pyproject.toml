[build-system]
requires = [
  "setuptools>=64",
  "setuptools-scm>=8",
  "setuptools-rust>=1.9",
]
build-backend = "setuptools.build_meta"

[project]
name = "tabmat"
dynamic = ["version"]
description = "Efficient matrix representations for working with tabular data."
readme = "README.md"
authors = [{ name = "QuantCo, Inc.", email = "noreply@quantco.com" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
requires-python = ">=3.11"
dependencies = ["formulaic>=1.2", "narwhals", "numpy", "scipy"]

[project.urls]
Homepage = "https://github.com/Quantco/tabmat"

[tool.setuptools]
# The wheel holds the Python modules and the compiled extension only, not the
# other files git tracks under src/ (the Rust sources in src/tabmat/crabmat).
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
# Only directories with an __init__.py are packages: src/tabmat/crabmat holds
# the Rust sources of the extension module tabmat.crabmat, not Python code.
namespaces = false

[tool.setuptools_scm]
version_scheme = "post-release"

# All kernels are one extension module (see Cargo.toml) so that they share one
# rayon thread pool. `debug = false` because setuptools-rust would otherwise
# make in-place (editable) builds debug builds; for a debug build, set
# SETUPTOOLS_RUST_CARGO_PROFILE=dev.
[[tool.setuptools-rust.ext-modules]]
target = "tabmat.crabmat"
path = "Cargo.toml"
debug = false

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
ignore = ["E731", "N802", "N803", "N806"]
select = [
  # pyflakes
  "F",
  # pycodestyle
  "E", "W",
  # isort
  "I",
  # pep8-naming
  "N",
  # pyupgrade
  "UP",
]

[tool.ruff.lint.isort]
known-first-party = ["tabmat"]

[tool.mypy]
python_version = '3.11'
exclude = [
  "tests/",
]
no_implicit_optional = false
check_untyped_defs = true
namespace_packages = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-s --tb=short"
norecursedirs = ["__pycache__", "build", "src/tabmat/benchmark"]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "high_memory: high memory consumption (deselect with '-m \"not high_memory\"')",
]
# Filters are standard python warning filters as described here:
# https://docs.python.org/3/library/warnings.html#the-warnings-filter
# The oldies and nightly environments override this with `-W default` (see pixi.toml).
filterwarnings = [
  # Treat any warning as an error by default; add specific `ignore` filters
  # below for unavoidable third-party warnings.
  "error",
]

[tool.cibuildwheel]
build-frontend = "build[uv]"
skip = [
  "*-win32",
  "*-manylinux_i686",
  "*-musllinux_*",
]
test-requires = ["pytest", "pytest-xdist"]
test-command = "pytest {package}/tests/test_matrices.py"

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET="12.0"

[tool.cibuildwheel.linux]
# The manylinux containers have no Rust toolchain; the macOS and Windows
# runners get one from the workflow (dtolnay/rust-toolchain).
before-all = [
  "curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal",
]

[tool.cibuildwheel.linux.environment]
PATH="$HOME/.cargo/bin:$PATH"

