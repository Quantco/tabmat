name: Build and upload to PyPI

on:
  pull_request:
  push:
    branches:
      - "main"
    tags:
      - "*"
  release:
    types:
      - published

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, windows-2022, macos-15, macos-15-intel]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        # On Linux, cibuildwheel installs Rust inside the manylinux container
        # instead (see `before-all` in pyproject.toml).
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable
      - name: Build wheels
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        with:
          extras: uv
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        name: Install Python
        with:
          python-version: '3.11'
      - name: Install build frontend
        run: python -m pip install build
      - name: Build sdist
        run: python -m build --sdist
      - name: Check that the Rust sources are in the sdist
        run: |
          tar -tzf dist/*.tar.gz > sdist-files.txt
          for f in Cargo.toml Cargo.lock src/tabmat/ext/crabmat/lib.rs src/tabmat/ext/crabmat/boundary.rs src/tabmat/ext/crabmat/kernels/mod.rs src/tabmat/ext/crabmat/kernels/categorical.rs src/tabmat/ext/crabmat/kernels/dense.rs src/tabmat/ext/crabmat/kernels/sparse.rs src/tabmat/ext/crabmat/kernels/split.rs src/tabmat/ext/crabmat/categorical.rs src/tabmat/ext/crabmat/dense.rs src/tabmat/ext/crabmat/sparse.rs src/tabmat/ext/crabmat/split.rs src/tabmat/ext/categorical.py src/tabmat/ext/dense.py src/tabmat/ext/sparse.py src/tabmat/ext/split.py; do
            grep -q "/$f\$" sdist-files.txt || { echo "$f missing from sdist"; exit 1; }
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/*.tar.gz

  upload_testpypi:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://test.pypi.org/p/tabmat
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  upload_pypi:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [build_wheels, build_sdist, upload_testpypi]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/tabmat
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
