name: CI

on:
  # We would like to trigger for CI for any pull request action -
  # both from QuantCo's branches as well as forks.
  pull_request:
  # In addition to pull requests, we want to run CI for pushes
  # to the main branch and tags.
  push:
    branches:
      - "main"
    tags:
      - "*"

jobs:
  pre-commit-checks:
    name: Linux - pre-commit checks
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          environments: lint default
      - name: pre-commit
        run: pixi run -e lint pre-commit-run --color=always --show-diff-on-failure
      - name: cargo fmt
        run: pixi run -e default cargo fmt --check
      - name: cargo clippy
        run: pixi run -e default cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: pixi run -e default cargo test

  unit-tests:
    name: Tests
    runs-on: ${{ matrix.os }}
    env:
      CI: True
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, environment: 'py311' }
          - { os: ubuntu-latest, environment: 'py312' }
          - { os: ubuntu-latest, environment: 'py313' }
          - { os: ubuntu-latest, environment: 'py314' }
          - { os: ubuntu-latest, environment: 'py314t' }
          - { os: ubuntu-latest, environment: 'py315' }
          - { os: windows-latest, environment: 'py314' }
          - { os: macos-latest, environment: 'py314' }
          - { os: ubuntu-latest, environment: 'oldies' }
          - { os: ubuntu-latest, environment: 'nightly' }
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          environments: ${{ matrix.environment }}
      - name: Update dependencies
        if: matrix.environment == 'nightly'
        run: pixi update -e ${{ matrix.environment }}
      - name: Install nightlies
        if: matrix.environment == 'nightly'
        run: pixi run -e ${{ matrix.environment }} install-nightlies
      - name: Install repository
        run: pixi run -e ${{ matrix.environment }} postinstall
      - name: Verify free-threaded imports
        if: matrix.environment == 'py314t'
        run: |
          pixi run -e py314t python - <<'PY'
          import sys
          import sysconfig

          assert sysconfig.get_config_var("Py_GIL_DISABLED") == 1
          import tabmat
          import tabmat.crabmat.categorical
          import tabmat.ext.dense
          import tabmat.ext.sparse
          import tabmat.ext.split

          assert not sys._is_gil_enabled(), "Importing tabmat enabled the GIL"
          PY
      - name: Run pytest
        run: pixi run -e ${{ matrix.environment }} test -nauto -m "not high_memory"
      - name: Run doctest
        # Check that the readme example will work by running via doctest.
        # We run outside the repo to make the test a bit more similar to
        # a user running after installing with conda.
        run: |
          mkdir ../temp
          cp README.md ../temp
          cd ../temp
          pixi run --manifest-path ../tabmat/pixi.toml -e ${{ matrix.environment }} python -m doctest -v README.md
